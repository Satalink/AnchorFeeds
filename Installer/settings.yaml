feeds:
- https://moxie.foxnews.com/google-publisher/latest.xml
output_dir: audio
retention: 12 Hours
feed_update_interval: 15 minutes
mark_as_played: when_ended_or_skipped
scan_mode: true
scan_countdown_seconds: 3
auto_play_next: true
retrieve_latest_feeds_on_launch: true
minimize_to_tray: false
close_to_tray: false
launch_at_startup: false
debug_logging: false
show_article_text: true
unplayed_only: true
starred_only: false
article_sort_order: newest_first
group_articles_by_feed: false
application_language: system
appearance_theme: system_desktop
mp3_bitrate_kbps: 0
tts_engine: edge_tts
voices:
  anchor_voices:
  - en-US-GuyNeural
  - en-US-JennyNeural
